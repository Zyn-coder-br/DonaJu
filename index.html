<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5f3a3f" />
  <meta name="description" content="Gestão da Dona Ju Confeitaria Artesanal" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Dona Ju | Gestão</title>
</head>
<body>
  <div id="auth-root"></div>
  <div id="app-shell" class="app-shell app-locked">
    <aside class="sidebar">
      <div class="brand"><img src="assets/logo.png" alt="Logo Dona Ju Confeitaria" /><div><strong>Dona Ju</strong><span>Gestão Artesanal</span></div></div>
      <nav id="main-nav" aria-label="Navegação principal">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon" data-icon="dashboard"></span><span>Dashboard</span></button>
        <button class="nav-item" data-view="orders"><span class="nav-icon" data-icon="orders"></span><span>Pedidos</span></button>
        <button class="nav-item" data-view="products"><span class="nav-icon" data-icon="products"></span><span>Produtos</span></button>
        <button class="nav-item" data-view="customers"><span class="nav-icon" data-icon="customers"></span><span>Clientes</span></button>
        <button class="nav-item" data-view="deliveries"><span class="nav-icon" data-icon="deliveries"></span><span>Entregas</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon" data-icon="reports"></span><span>Relatórios</span></button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> V0.5.1 • Gestão</div>
    </aside>

    <main class="main-content">
      <div class="mobile-brand"><img src="assets/logo.png" alt="Logo Dona Ju"><div><strong>Dona Ju</strong><span>Confeitaria Artesanal</span></div></div>
      <header class="topbar">
        <div><span class="eyebrow">DONA JU CONFEITARIA ARTESANAL</span><h1 id="page-title">Dashboard</h1></div>
      </header>
      <section id="app-view" class="view-container" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
